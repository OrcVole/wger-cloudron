# Client authentication for the bundled PostgreSQL (docs/decisions/0006). Read from the image via
# hba_file, never from PGDATA, so a restored cluster cannot bring its own rules.
#
# The socket directory (/app/pgdata) is mode 0700 and owned by cloudron, the user every package
# process runs as, so trust on the socket admits only this container's own processes.
# TCP is loopback only and needs a password; PowerSync is its only user.

# TYPE  DATABASE     USER        ADDRESS         METHOD
local   all          all                         trust
host    wger         powersync   127.0.0.1/32    scram-sha-256
host    replication  powersync   127.0.0.1/32    scram-sha-256
host    all          all         127.0.0.1/32    reject
