; PowerSync (docs/decisions/0006). autostart=false: bootstrap.sh starts it only after the database
; is migrated and the powersync role, schema and grants exist. Stops before gunicorn and postgres.
[program:powersync]
command=/app/code/powersync/run.sh start
user=cloudron
directory=/run/powersync
priority=50
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
