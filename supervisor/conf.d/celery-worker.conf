; celery worker: background jobs (exercise/ingredient sync from wger.de, email, scheduled
; tasks). --pool=gevent --concurrency matches upstream's own /start-worker invocation
; (phase-notes/phase-2.md). CELERY_WORKER_CONCURRENCY is operator-tunable, defaulted to 2 by
; start.sh's `:=` block before the operator override file is sourced.
;
; autostart=false: started by bootstrap.sh (via supervisorctl) once migrations are complete, for
; the same reason as gunicorn (supervisor/conf.d/gunicorn.conf) -- it must not run against an
; un-migrated schema.
[program:celery-worker]
command=/home/wger/.local/bin/celery --app wger worker --pool=gevent --concurrency %(ENV_CELERY_WORKER_CONCURRENCY)s
directory=/home/wger/src
user=cloudron
priority=30
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
