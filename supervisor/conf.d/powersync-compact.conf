; Daily PowerSync bucket-storage compaction (powersync/compact-loop.sh). Started by bootstrap.sh
; with PowerSync itself.
[program:powersync-compact]
command=/app/code/powersync/compact-loop.sh
user=cloudron
directory=/run/powersync
priority=55
autostart=false
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
