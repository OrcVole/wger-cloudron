; nginx: binds the manifest httpPort (8000), serves /static/ and /media/ directly, proxies
; everything else to gunicorn, answers /healthcheck immediately (see nginx/wger.conf).
[program:nginx]
command=/usr/sbin/nginx -c /app/code/nginx/wger.conf
user=cloudron
directory=/app/code
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
