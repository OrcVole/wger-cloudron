; bootstrap: one-shot first-run/every-boot database setup (probe emptiness, run wger bootstrap
; and seed the admin password on a genuinely empty database, migrate, set-site-url), then starts
; gunicorn/celery-worker/celery-beat via supervisorctl. Runs concurrently with nginx rather than
; before supervisord starts, so /healthcheck is reachable immediately regardless of how long
; migrations take; see bootstrap.sh's header comment for the full rationale.
[program:bootstrap]
command=/app/code/bootstrap.sh
user=cloudron
directory=/home/wger/src
priority=15
autostart=true
autorestart=false
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
