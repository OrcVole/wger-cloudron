; gunicorn: the Django application server, internal only (127.0.0.1:8010, never exposed
; directly -- nginx is the only thing that talks to it). --workers is computed by start.sh from
; the container's cgroup CPU quota (capped at 3) and passed through via the GUNICORN_WORKERS
; environment variable, which supervisord inherits from the process that exec'd it and hands
; down to every program by default; %(ENV_...)s below is supervisord's own environment-variable
; expansion syntax, evaluated when the program is started, not baked in at packaging time.
; GUNICORN_EXTRA_ARGS is the operator-tunable escape hatch (empty by default; set in
; /app/data/env to add e.g. --log-level debug), always present as an env var (even if empty)
; because start.sh sets a `:=` default for it before sourcing the operator override file.
;
; autostart=false: started by bootstrap.sh (via supervisorctl) only once migrations have run and
; -- on a first-run empty database -- the fixture admin password has already been replaced with
; a random one. Never runs against an un-migrated schema, and no login page is reachable until
; that reset has already happened. See bootstrap.sh's header comment for the full rationale.
[program:gunicorn]
command=/home/wger/.local/bin/gunicorn wger.wsgi:application --preload --bind 127.0.0.1:8010 --workers %(ENV_GUNICORN_WORKERS)s --threads 2 --timeout 240 %(ENV_GUNICORN_EXTRA_ARGS)s
directory=/home/wger/src
user=cloudron
priority=20
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
