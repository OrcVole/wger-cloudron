; celery beat: schedules the periodic celery jobs (exercise/ingredient sync, JWT/session
; cleanup, see wger/tasks.py's periodic task registration). The schedule file lives under /run
; (ephemeral, rebuilt every boot from the task definitions in the image -- it is a cache, not
; state, so it is deliberately not under /app/data). /run/wger is created and chowned to
; cloudron by start.sh before supervisord starts.
;
; autostart=false: started by bootstrap.sh (via supervisorctl) once migrations are complete, for
; the same reason as gunicorn (supervisor/conf.d/gunicorn.conf) -- celery beat's own
; django_celery_beat-free crontab scheduler still touches the ORM indirectly through the tasks
; it schedules, so it waits for the same all-clear.
[program:celery-beat]
command=/home/wger/.local/bin/celery --app wger beat --schedule /run/wger/celerybeat-schedule
directory=/home/wger/src
user=cloudron
priority=40
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
