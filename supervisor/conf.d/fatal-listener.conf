; fatal-exit listener: converts any program's FATAL state into a supervisord shutdown, so the
; container dies loudly instead of sitting behind the always-200 health shim serving 502s. See
; supervisor/fatal-exit-listener.py for the full rationale. stdout is the eventlistener
; protocol channel: it must NOT be redirected or merged with stderr, or the protocol breaks.
[eventlistener:fatal-exit]
command=python3 /app/code/supervisor/fatal-exit-listener.py
events=PROCESS_STATE_FATAL
user=cloudron
priority=5
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
