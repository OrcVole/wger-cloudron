; The bundled PostgreSQL (docs/decisions/0006). Starts first among the programs and stops last
; (supervisord stops in reverse priority order), so every client is gone before the server.
; SIGINT is PostgreSQL's "fast" shutdown: roll back open transactions, then exit cleanly.
[program:postgres]
command=/app/code/postgres/run.sh
user=cloudron
directory=/app/pgdata
priority=8
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
