; supervisord main config for the wger Cloudron package.
;
; supervisord itself runs as root (started by start.sh via tini, see the `exec` line at the end
; of start.sh); each program below drops to `user=cloudron` individually. pidfile and the unix
; control socket live under /run, created and chowned by start.sh on every boot (before this
; process starts) since /run does not persist across restarts.
;
; --nodaemon is passed on the command line by start.sh's final exec; nodaemon is intentionally
; NOT repeated here so there is exactly one source of truth for it.

[unix_http_server]
file=/run/supervisor/supervisor.sock
; bootstrap.sh runs as cloudron and needs to reach this socket via supervisorctl, once it has
; finished migrations, to start gunicorn/celery-worker/celery-beat (see bootstrap.sh and
; supervisor/conf.d/bootstrap.conf). supervisord itself creates and owns this file as root, so
; group ownership and a group-writable mode are how the non-root program reaches it; the parent
; directory /run/supervisor is created 0750 root:cloudron by start.sh for the same reason. No
; other user/group can reach it: this is not exposed outside the container's own /run.
chown=root:cloudron
chmod=0770

[supervisord]
user=root
pidfile=/run/supervisor/supervisord.pid
; supervisord's own log goes to the container's stdout too, same as every program it runs
; (AGENTS.md: "Topology, one row per process, all logging to stdout").
logfile=/dev/fd/1
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[include]
files = /app/code/supervisor/conf.d/*.conf
