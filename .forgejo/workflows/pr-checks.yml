# .forgejo/workflows/pr-checks.yml — the merge button becomes the gate.
#
# PROVEN 2026-08-09. Written 2026-08-08 and since executed against real packages: the full path on a
# two-surface scanner with a denylist secret, and the inline-patterns path on a package with none.
# Both green, and its first runs found two defects in the checking apparatus rather than in any
# package — which is the argument for running a gate before trusting it.
#
# NOTE THIS FILE IS PUBLISHABLE and is scanned by test/secret-scan.sh like everything else. An
# earlier draft named the forge host and the runner machine in these comments and was caught by the
# scan for exactly that. Describe the topology in general terms here; the specifics live in the
# estate's own notes, which are not published.
#
# THE RUNNER IT TARGETS (registered 2026-08-08)
# Registered at USER level on the main forge, so one runner serves every package repo
# without per-repo registration. Its label is `workstation`, declared as `workstation:host`, which
# means steps run DIRECTLY on the workstation rather than inside a job container. That is the
# deliberate choice: these gates build and run container images themselves, so a containerised job
# would be docker-in-docker for no benefit.
#
# Consequences of host mode, all of which have bitten someone before:
#   * There is NO docker daemon on the workstation. Rootless podman is the engine, and the unit sets
#     DOCKER_HOST to its socket so a script asking for docker still finds one.
#   * The job inherits the runner unit's PATH, nothing more. node is on it (JS actions need it) but
#     it is an nvm path carrying a version number — see the unit's own comment.
#   * The workspace is a real directory on a real machine, not a fresh container. Steps must not
#     assume a clean filesystem beyond their own checkout.
#
# THE EXPERIMENT THIS SERVES ("Update-as-PR", doctrine/cloudron-packaging-experiments.md)
# A detected upstream release arrives as a pull request — pin, manifest (including dockerImage) and
# a draft feed entry — and the two gates that can run without the rig run as checks on it. The human
# gate stops being "remember to run the scripts" and becomes the merge button, which is the one
# control that cannot be forgotten.
#
# WHY THESE TWO GATES AND NOT THE OTHERS
#   test/secret-scan.sh  present in all 18 packages. Scans the publishable file set AND the built
#                        image, so it needs the image built first. This is the gate whose failure is
#                        unrecoverable after the fact — once pushed, it is public — so it runs first.
#   test/smoke.sh        present in 14 of 18. Explicitly "no box required": it runs the image the way
#                        Cloudron does and asserts the package contract. Skipped where absent rather
#                        than failing, because four packages legitimately have no smoke gate.
# Everything else (backup-restore, upgrade, gate2, sso-topology) needs a live Cloudron and belongs on
# the Proving Ground via bench-package.sh, not in CI. Do not be tempted to add them here.

name: PR checks
on:
  pull_request:
    branches: [main]

env:
  # The tag the gates build and inspect. Kept in one place: both scripts take an image argument and
  # they must be handed the SAME one, or secret-scan proves a different artefact than smoke tested.
  IMAGE: ci-pr-${{ github.event.pull_request.number }}

jobs:
  gates:
    # Matches the `workstation` label declared by runner id 1. A label with no runner queues forever
    # and reports nothing, which looks like a guarded PR and is not one.
    runs-on: workstation
    steps:
      - uses: actions/checkout@v4

      # podman, not docker: there is no docker daemon here. The gate scripts already default to
      # podman (they document ENGINE=docker as the override), so this matches them rather than
      # fighting them.
      - name: build the image the gates inspect
        run: podman build -t "$IMAGE" .

      # secret-scan's box, identity and session patterns live in `.anonymize-list`, which is
      # GITIGNORED by design (so the published script never carries the strings it hunts for) and is
      # therefore ABSENT FROM EVERY CI CHECKOUT. Without it the scan still runs, but only against
      # generic credential shapes — it quietly becomes a much weaker gate that still reports green.
      #
      # Measured on this workflow's own first run, 2026-08-08: an earlier draft of this file named
      # the forge host in a comment. CI passed it. The same scan run locally, where the denylist
      # exists, FAILED it. That is the exact shape of a check that proves less than it looks.
      #
      # So: rebuild the denylist from a repo secret, and REFUSE to continue without one. A gate that
      # cannot make its strongest claim must say so rather than pass.
      #
      # Required only where the scanner actually reads the file. Two generations of secret-scan.sh
      # exist across the estate: most read `.anonymize-list`, but langfuse, prosody and windmill
      # carry their patterns INLINE and need no secret. Demanding one there would be a gate that can
      # never pass, for nothing — so ask the script what it needs rather than assuming.
      #
      # The value arrives via `env:`, not by interpolating into the shell: denylists are multi-line
      # and a bare `${{ }}` inside a test expression breaks the moment one contains a quote.
      - name: restore the anonymity denylist
        env:
          ANONYMIZE_LIST: ${{ secrets.ANONYMIZE_LIST }}
        run: |
          if ! grep -q 'anonymize-list' test/secret-scan.sh; then
            echo "this package's scanner carries its patterns inline; no denylist needed"
            exit 0
          fi
          if [ -z "$ANONYMIZE_LIST" ]; then
            echo "ANONYMIZE_LIST is not set, and this package's scanner reads it. The scan would run"
            echo "without its box/identity patterns and report a green check that proves far less"
            echo "than it appears to. Set the secret (contents of .anonymize-list) for this repo."
            exit 1
          fi
          printf '%s\n' "$ANONYMIZE_LIST" > .anonymize-list
          echo "denylist restored: $(grep -cvE '^\s*(#|$)' .anonymize-list) patterns"

      # First, because a leaked secret is the one failure that cannot be undone after a push.
      #
      # SCAN_REPORT_ONLY was set here on 2026-08-09 for one evidence-gathering pass, while the
      # denylists were unified and eight packages had their image surface scanned for the first time.
      # That pass is done: 222 repo-surface hits went to 0, and 746 image-surface hits went to 0,
      # every one of them a false positive with a nameable cause. It is REMOVED, deliberately, so
      # this gate can fail a build again. Do not reintroduce it to quieten a finding — fix the
      # pattern, then the file, and only then declare an exception in .scan-allowlist.
      - name: secret-scan
        run: test/secret-scan.sh "$IMAGE"

      # Skipped, not failed, where a package has no smoke gate: 4 of 18 legitimately do not.
      - name: smoke
        run: |
          if [ -x test/smoke.sh ]; then
            test/smoke.sh "$IMAGE"
          else
            echo "no test/smoke.sh in this package — skipping (this is expected for 4 of 18)"
          fi

      # Host mode leaves both the image AND the workspace on a shared machine — this is not a
      # container that vanishes. So remove the image rather than accumulating one per PR, and delete
      # the restored denylist rather than leaving the estate's identity strings sitting in a
      # checkout. `|| true`: a failed cleanup must never fail a passing gate.
      - name: clean up
        if: always()
        run: |
          rm -f .anonymize-list || true
          podman rmi -f "$IMAGE" || true
