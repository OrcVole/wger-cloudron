# nginx main config for the wger Cloudron package.
#
# Entirely static: every value here is fixed at packaging time (port 8000, upstream gunicorn at
# 127.0.0.1:8010, static/media paths). Per phase-notes/phase-3.md this qualifies for the
# "static under /app/code" branch of the nginx placement decision -- nothing here depends on a
# CLOUDRON_* value resolved at boot, so it ships read-only in the image and start.sh never
# templates or copies it into /run.
#
# Runs entirely as `cloudron` (never as root, see supervisor/conf.d/nginx.conf), so:
#   - no `user` directive: there is no root master process to drop privilege from; nginx would
#     only print a harmless "ignored" warning if one were present.
#   - error_log uses the `stderr` KEYWORD, not the literal path /dev/stderr: nginx's own error
#     log is opened by path before privilege is available to do so as this container's non-root
#     process in some code paths, which fails EACCES; `stderr` writes directly to the inherited
#     fd 2 instead of re-opening a path (doctrine gotcha; verified with a throwaway config
#     against cloudron/base:5.0.0 on 2026-08-01: literal /dev/stdout for access_log did NOT
#     reproduce the same failure once /run/nginx was pre-created and chowned to cloudron by
#     start.sh before nginx starts, so access_log keeps the ordinary /dev/stdout path).
#   - pid file and ALL temp paths live under /run/nginx/, created and chowned by start.sh on
#     every boot before supervisord starts (docs: /run is writable but does not persist across
#     restarts, so nothing here can be baked into the image).
daemon off;
worker_processes auto;
error_log stderr;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Upload limit for exercise/nutrition images and videos, mirrored from upstream's own
    # nginx config (config/nginx.conf in wger-project/docker, fetched 2026-08-01).
    client_max_body_size 100M;

    access_log /dev/stdout;

    client_body_temp_path /run/nginx/client_body_temp;
    proxy_temp_path       /run/nginx/proxy_temp;
    fastcgi_temp_path     /run/nginx/fastcgi_temp;
    uwsgi_temp_path       /run/nginx/uwsgi_temp;
    scgi_temp_path        /run/nginx/scgi_temp;

    # Cloudron's own front-end proxy terminates TLS and always sets X-Forwarded-Proto; we must
    # never overwrite it with $scheme (this container only ever sees http). The map only
    # supplies a fallback for the case nginx is hit directly (debugging, health probes from
    # inside the container) where the header is absent.
    map $http_x_forwarded_proto $wger_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      "https";
    }

    upstream wger_gunicorn {
        server 127.0.0.1:8010;
    }

    server {
        listen 0.0.0.0:8000;
        server_name _;

        # Immediate-health shim (AGENTS.md / phase-3.md): answered directly by nginx, never
        # proxied to Django, so Cloudron's install/update health check does not fail during a
        # slow first boot (migrations, fixtures) or a slow gunicorn warmup.
        location = /healthcheck {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Baked at build time (see Dockerfile), read-only, changes exactly when the image
        # changes. Filenames are content-hashed by collectstatic, hence the immutable cache.
        location /static/ {
            alias /app/code/static/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        # User-uploaded media, persisted under the localstorage addon's /app/data.
        location /media/ {
            alias /app/data/media/;
        }

        location / {
            proxy_pass http://wger_gunicorn;
            proxy_http_version 1.1;
            proxy_redirect off;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $wger_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;

            # Upstream's own config sets 86400s here, sized for PowerSync's long-lived
            # WebSocket/HTTP-2 streaming connections (config/nginx.conf, /ps/ location).
            # PowerSync is deliberately not part of this package version (AGENTS.md), and this
            # package's `/` location proxies only ordinary request/response HTTP to gunicorn, so
            # 86400s would only mask a hung backend. Timeouts are instead sized to sit
            # comfortably above gunicorn's own --timeout 240 (see supervisor/conf.d/gunicorn.conf)
            # so nginx never cuts a request off before gunicorn's own worker timeout would.
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
